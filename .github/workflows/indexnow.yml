name: IndexNow

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      paths:
        description: '알릴 경로 (공백으로 구분, 예: /news /news/slug)'
        required: true

permissions:
  contents: read
  deployments: read

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  submit:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Notify IndexNow
        run: node scripts/indexnow.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOYMENT_ID: ${{ github.event.deployment.id }}
          DEPLOYMENT_SHA: ${{ github.event.deployment.sha }}
          INDEXNOW_PATHS: ${{ inputs.paths }}
